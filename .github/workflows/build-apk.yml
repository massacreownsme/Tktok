name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Optional path to the Android project ZIP in this repository (leave blank to auto-detect)"
        required: false
        type: string
      gradle_task:
        description: "Gradle task to run"
        required: false
        default: "assembleDebug"
        type: string
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and extract ZIP if present
        id: project
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          # Prefer a Gradle project already checked into the repository root.
          if [[ -z "${ZIP_INPUT:-}" && ( -f settings.gradle || -f settings.gradle.kts ) ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            echo "Using Android project at repository root."
            exit 0
          fi

          # Use the explicitly selected ZIP, or auto-detect one.
          ZIP_FILE="${ZIP_INPUT:-}"
          if [[ -n "$ZIP_FILE" && ! -f "$ZIP_FILE" ]]; then
            echo "::error::ZIP not found: $ZIP_FILE"
            exit 1
          fi
          if [[ -z "$ZIP_FILE" ]]; then
            ZIP_FILE="$(find . -maxdepth 5 -type f -name '*.zip' -print -quit)"
          fi
          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::No Gradle project found at repository root and no project ZIP found. Set zip_path or add the ZIP to the repository."
            echo "Repository files:"
            find . -maxdepth 4 -type f -print | head -150
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p extracted
          python3 - "$ZIP_FILE" extracted <<'PY'
          import sys, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP entry: {item.filename}")
                  target = (destination / Path(*path.parts)).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe ZIP entry: {item.filename}")
              zf.extractall(destination)
          PY

          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in the ZIP."
            find extracted -maxdepth 5 -type f -print | head -150
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using extracted project at: $PROJECT_DIR"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ ! -f settings.gradle && ! -f settings.gradle.kts ]]; then
            echo "::error::settings.gradle(.kts) is missing."
            exit 1
          fi
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties || ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "::error::Gradle wrapper is missing. Attempting to generate it with installed Gradle."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          GRADLE_TASK: ${{ inputs.gradle_task || 'assembleDebug' }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon "$GRADLE_TASK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
