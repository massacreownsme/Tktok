name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Optional path to the Android project ZIP in this repository"
        required: false
        type: string
      gradle_task:
        description: "Gradle task to run"
        required: false
        default: "assembleDebug"
        type: string
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Do not enable setup-java's Gradle cache here: the project is inside a ZIP
      # and has not been extracted yet, so the cache action cannot find Gradle files.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate and extract Android project ZIP
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [[ -n "${ZIP_INPUT:-}" ]]; then
            ZIP_FILE="$ZIP_INPUT"
            [[ -f "$ZIP_FILE" ]] || { echo "::error::ZIP not found: $ZIP_FILE"; exit 1; }
          else
            ZIP_FILE="$(find . -maxdepth 5 -type f -name '*.zip' -print -quit)"
            [[ -n "$ZIP_FILE" ]] || { echo "::error::No .zip file found in the repository. Add your Android project ZIP or set zip_path."; exit 1; }
          fi
          echo "Using ZIP: $ZIP_FILE"
          mkdir -p project
          python3 - "$ZIP_FILE" project <<'PY'
          import sys, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP entry: {item.filename}")
                  target = (destination / Path(*path.parts)).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe ZIP entry: {item.filename}")
              zf.extractall(destination)
          PY

          SETTINGS_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in the ZIP. The ZIP may not contain an Android/Gradle project."
            echo "Files extracted (first 100):"
            find project -maxdepth 5 -type f -print | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Gradle project directory: $PROJECT_DIR"
          echo "Gradle files found:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle-wrapper.properties' \) -print

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "::error::The extracted project must contain gradlew and gradle/wrapper/gradle-wrapper.properties."
            echo "Project files:"
            find . -maxdepth 5 -type f -print | head -150
            exit 1
          fi
          chmod +x gradlew

      - name: Build APK
        shell: bash
        env:
          GRADLE_TASK: ${{ inputs.gradle_task || 'assembleDebug' }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon "$GRADLE_TASK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
