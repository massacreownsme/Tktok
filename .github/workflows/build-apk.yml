name: Build Android APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Optional ZIP path committed in this repository; blank auto-finds a ZIP"
        required: false
        default: ""
      gradle_task:
        description: "Gradle task to run"
        required: true
        default: "assembleDebug"
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [ -n "${ZIP_INPUT:-}" ] && [ -f "$ZIP_INPUT" ]; then
            SELECTED="$ZIP_INPUT"
          else
            SELECTED="$(find . -type f -iname '*.zip' \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -print -quit)"
          fi
          if [ -z "${SELECTED:-}" ] || [ ! -f "$SELECTED" ]; then
            echo "::error::No ZIP found in the checked-out repository. Upload and commit the ZIP to GitHub first."
            find . -maxdepth 4 -type f | sort | head -100
            exit 1
          fi
          echo "Using ZIP: $SELECTED"
          echo "zip_path=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP safely
        shell: bash
        env:
          ZIP_PATH: ${{ steps.find_zip.outputs.zip_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-project"
          python3 - "$ZIP_PATH" "$RUNNER_TEMP/android-project" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path rejected: {item.filename}")
              zf.extractall(destination)
          print(f"Extracted {archive} into {destination}")
          PY
          echo "PROJECT_ROOT=$RUNNER_TEMP/android-project" >> "$GITHUB_ENV"

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find "$PROJECT_ROOT" -maxdepth 7 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found inside the ZIP. The ZIP needs Android project source files."
            find "$PROJECT_ROOT" -maxdepth 4 -type f | sort | head -120
            exit 1
          fi
          BUILD_DIR="$(dirname "$SETTINGS")"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Project root: $BUILD_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do not pass `tools` to setup-android: it is not a valid SDK package ID.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable was not found under ANDROID_HOME/cmdline-tools."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          if [ -x ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew "${GRADLE_TASK:-assembleDebug}" --no-daemon
          else
            echo "::error::The project ZIP has no gradlew wrapper. Add the Gradle wrapper to the project ZIP."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.BUILD_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
